name: Build Windows Version

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore "Windows Version/PrismWinUI/PrismWinUI.csproj"

      - name: Build
        run: dotnet build "Windows Version/PrismWinUI/PrismWinUI.csproj" -c Release --no-restore

      - name: Publish
        run: dotnet publish "Windows Version/PrismWinUI/PrismWinUI.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath Prism-Windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Prism-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (non-tag pushes)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Prism-Windows
          path: Prism-Windows.zip
