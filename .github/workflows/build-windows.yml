name: Build Prism Windows (Tauri)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI 2
        run: cargo install tauri-cli --version "^2"

      - name: Build Windows NSIS installer
        working-directory: Prism/Tauri Version/Windows Version
        run: cargo tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows-NSIS
          path: Prism/Tauri Version/Windows Version/src-tauri/target/release/bundle/nsis/*.exe
